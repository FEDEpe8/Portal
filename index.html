<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chascomús SIG - Inicio</title>
    <meta name="description" content="Portal de mapas interactivos y capas geográficas del Partido de Chascomús. Territorio, comercios, turismo, servicios y más, todo en un solo lugar.">
    <meta name="theme-color" content="#1a2a4f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Open Graph -->
    <meta property="og:title" content="Chascomús SIG - Portal Geográfico">
    <meta property="og:description" content="Explorá mapas interactivos, capas temáticas y datos geoespaciales del Partido de Chascomús.">
    <meta property="og:type" content="website">

    <!-- FAVICON -->
    <link rel="icon" type="image/jpeg" href="escudo.jpeg">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
    <link rel="apple-touch-icon" href="iconos/icon-192.png">

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Resource Hints -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" crossorigin="anonymous">

    <!-- Estilos -->
    <link rel="stylesheet" href="home.css">
</head>
<body>

<!-- HEADER -->
<header class="home-header" role="banner">
    <a href="index.html" class="home-logo" aria-label="Chascomús SIG - Inicio">
        <img src="escudo.jpeg" alt="Escudo Municipalidad de Chascomús">
        <div class="home-logo-text">
            <strong>Chascomús</strong>
            <span>Sistema de Información Geográfica</span>
        </div>
    </a>
    <a href="mapa.html" class="home-cta-btn">
        <i class="fas fa-map"></i> <span>Abrir el mapa</span>
    </a>
</header>

<main>
    <!-- HERO -->
    <section class="hero">
        <div class="hero-inner">
            <h1>Chascomús Georreferenciado</h1>
            <p>Explorá mapas interactivos, capas temáticas y datos geoespaciales del Partido de Chascomús. Todo en un solo lugar.</p>
            <a class="hero-cta" href="mapa.html">
                <i class="fas fa-map-location-dot"></i> Abrir el visor de mapas
            </a>
        </div>
    </section>

    <!-- CATEGORÍAS -->
    <section class="categories" aria-labelledby="categoriesTitle">
        <h2 id="categoriesTitle">Explorar por categoría</h2>
        <div class="category-grid" id="categoryGrid">
            <!-- Se completa dinámicamente desde json/home.js -->
        </div>
    </section>
</main>

<!-- FOOTER -->
<footer class="home-footer">
    <i class="far fa-copyright"></i> Municipalidad de Chascomús | Datos abiertos
</footer>

<script type="module" src="./json/home.js"></script>
</body>
</html>
